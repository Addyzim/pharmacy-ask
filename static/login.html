<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAVII Ask — вход</title>
<style>
:root{--ink:#101418;--muted:#6b7784;--line:#e3e8ee;--accent:#0f7b6c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#0f7b6c 0%,#0b5a52 45%,#0d3b45 100%);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
.box{background:#fff;width:380px;max-width:92vw;border-radius:18px;padding:34px 32px;
  box-shadow:0 24px 60px rgba(0,0,0,.28)}
.logo{font-size:24px;font-weight:700;letter-spacing:-.5px;margin-bottom:2px}
.logo span{color:var(--accent)}
.sub{color:var(--muted);font-size:13.5px;margin-bottom:24px}
label{display:block;font-size:12px;color:var(--muted);font-weight:600;
  text-transform:uppercase;letter-spacing:.4px;margin:14px 0 6px}
input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;
  font-size:15px;outline:0}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,123,108,.12)}
button{width:100%;margin-top:22px;background:var(--accent);color:#fff;border:0;border-radius:10px;
  padding:12px;font-size:15px;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.err{color:#b91c1c;font-size:13.5px;margin-top:12px;min-height:18px}
.hint{margin-top:18px;padding:10px 12px;background:#f4f6f8;border-radius:10px;
  font-size:12.5px;color:var(--muted)}
.hint b{color:var(--ink)}
</style>
</head>
<body>
<form class="box" id="f">
  <div class="logo">SAVII <span>Ask</span></div>
  <div class="sub">аналитика аптечной сети по вопросам на русском</div>
  <label for="u">Логин</label>
  <input id="u" autocomplete="username" value="admin">
  <label for="p">Пароль</label>
  <input id="p" type="password" autocomplete="current-password" value="admin">
  <button id="b" type="submit">Войти</button>
  <div class="err" id="e"></div>
  <div class="hint">Демо-доступ: <b>admin</b> / <b>admin</b></div>
</form>
<script>
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const b = document.getElementById('b'), err = document.getElementById('e');
  b.disabled = true; err.textContent = '';
  try {
    const r = await fetch('/api/login', {method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({username: u.value.trim(), password: p.value})});
    const d = await r.json();
    if (r.ok) { location.href = '/'; return; }
    err.textContent = d.error || 'Ошибка входа';
  } catch(ex) { err.textContent = ex.message; }
  b.disabled = false;
};
</script>
</body>
</html>
